<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard — Desafío Airtm La Verde</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --green:#00C896; --green-dark:#00A87D; --green-glow:rgba(0,200,150,0.12);
  --bg:#060A08; --surface:#0E1512; --surface2:#162018;
  --border:rgba(0,200,150,0.1); --text:#E8F5F2; --muted:rgba(232,245,242,0.38);
  --pink:#FF2D87; --warning:#FFAB40; --gold:#FFD700; --silver:#C0C0C0; --bronze:#CD7F32;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100vh}
body{font-family:'Sora',sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden}

/* Animated bg */
body::before{content:'';position:fixed;inset:0;
  background-image:linear-gradient(rgba(0,200,150,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,200,150,.025) 1px,transparent 1px);
  background-size:60px 60px;pointer-events:none;z-index:0}
body::after{content:'';position:fixed;top:-200px;left:50%;transform:translateX(-50%);
  width:700px;height:700px;
  background:radial-gradient(circle,rgba(255,45,135,.06) 0%,rgba(0,200,150,.04) 40%,transparent 70%);
  pointer-events:none;z-index:0}

.page{position:relative;z-index:1;max-width:700px;margin:0 auto;padding:0 20px 60px}

/* HEADER */
.header{text-align:center;padding:40px 0 30px}
.header-badge{display:inline-block;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--pink);border:1px solid rgba(255,45,135,.3);background:rgba(255,45,135,.07);
  padding:5px 14px;border-radius:100px;margin-bottom:16px}
.header-title{font-size:clamp(32px,7vw,56px);font-weight:900;letter-spacing:-2px;line-height:1;margin-bottom:6px}
.header-title em{font-style:normal;color:var(--green)}
.header-title .pink{color:var(--pink)}
.header-sub{font-size:13px;color:var(--muted);font-weight:300}
.live-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);
  animation:pulse 1.4s ease-in-out infinite;margin-right:6px;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.65)}}

/* SEARCH — collapsed by default */
.search-wrap{margin-bottom:20px}
.search-toggle-btn{display:flex;align-items:center;gap:7px;background:transparent;
  border:1px solid var(--border);border-radius:10px;padding:7px 14px;
  color:var(--muted);font-family:'Sora',sans-serif;font-size:12px;font-weight:600;
  cursor:pointer;transition:all .2s;margin-bottom:0}
.search-toggle-btn:hover{border-color:rgba(0,200,150,.3);color:var(--text)}
.search-toggle-btn.open{border-color:rgba(0,200,150,.3);color:var(--green);background:var(--green-glow)}
.search-body{max-height:0;overflow:hidden;transition:max-height .35s ease,opacity .3s ease;opacity:0}
.search-body.open{max-height:300px;opacity:1;margin-top:10px}
.search-box{position:relative}
.search-box input{width:100%;background:var(--surface);border:1.5px solid var(--border);
  border-radius:14px;padding:14px 16px 14px 44px;color:var(--text);
  font-family:'Sora',sans-serif;font-size:15px;outline:none;
  transition:border-color .2s,box-shadow .2s}
.search-box input:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-glow)}
.search-box input::placeholder{color:var(--muted)}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
.search-results{margin-top:10px}
.sr-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:14px;
  animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:translateX(0)}}
.sr-rank{font-size:24px;font-weight:900;color:var(--muted);min-width:44px;text-align:center;font-family:'JetBrains Mono',monospace}
.sr-rank.top1{color:var(--gold)}
.sr-rank.top2{color:var(--silver)}
.sr-rank.top3{color:var(--bronze)}
.sr-info{flex:1}
.sr-name{font-size:15px;font-weight:700;color:var(--text);margin-bottom:2px}
.sr-email{font-size:11px;color:var(--muted)}
.sr-score{font-size:22px;font-weight:800;color:var(--green);font-family:'JetBrains Mono',monospace}
.sr-total{font-size:10px;color:var(--muted);text-align:right}
.no-results{text-align:center;padding:20px;color:var(--muted);font-size:13px}

/* LEADERBOARD */
.lb-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.lb-title{font-size:12px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--green)}
.lb-meta{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.lb-refreshing{display:inline-block;width:8px;height:8px;border:2px solid var(--border);border-top-color:var(--green);
  border-radius:50%;animation:spin .8s linear infinite;margin-right:5px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

/* PODIUM — top 3 */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;margin-bottom:20px;align-items:end}
.podium-item{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:16px 12px;text-align:center;position:relative;overflow:hidden}
.podium-item.p1{border-color:rgba(255,215,0,.3);background:linear-gradient(160deg,rgba(255,215,0,.06),var(--surface))}
.podium-item.p2{border-color:rgba(192,192,192,.2);background:linear-gradient(160deg,rgba(192,192,192,.04),var(--surface))}
.podium-item.p3{border-color:rgba(205,127,50,.2);background:linear-gradient(160deg,rgba(205,127,50,.04),var(--surface))}
.podium-medal{font-size:28px;margin-bottom:8px;line-height:1}
.podium-name{font-size:13px;font-weight:700;color:var(--text);margin-bottom:6px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.podium-score{font-size:clamp(20px,4vw,32px);font-weight:900;letter-spacing:-1px;font-family:'JetBrains Mono',monospace}
.p1 .podium-score{color:var(--gold)}
.p2 .podium-score{color:var(--silver)}
.p3 .podium-score{color:var(--bronze)}
.podium-pts{font-size:9px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.podium-attempts{font-size:10px;color:var(--muted);margin-top:4px}
.crown{position:absolute;top:-2px;right:8px;font-size:18px;animation:float 3s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* REST OF TOP 10 */
.lb-list{}
.lb-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:13px 16px;margin-bottom:8px;display:flex;align-items:center;gap:14px;
  transition:border-color .2s;animation:fadeItem .4s ease both}
.lb-item:hover{border-color:rgba(0,200,150,.2)}
@keyframes fadeItem{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.lb-rank{font-size:13px;font-weight:700;color:var(--muted);min-width:28px;text-align:center;
  font-family:'JetBrains Mono',monospace}
.lb-info{flex:1;min-width:0}
.lb-name{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-attempts{font-size:10px;color:var(--muted);margin-top:1px}
.lb-score{font-size:20px;font-weight:800;color:var(--green);font-family:'JetBrains Mono',monospace}

/* EMPTY */
.empty-state{text-align:center;padding:50px 20px;color:var(--muted)}
.empty-icon{font-size:48px;margin-bottom:12px}
.empty-txt{font-size:14px;line-height:1.7}

/* PLAYOFFS VIEW */
.playoffs-wrap{display:flex;flex-direction:column;gap:16px;padding:8px 0}
.playoff-card{border-radius:20px;padding:24px 22px;display:flex;align-items:center;gap:20px;position:relative;overflow:hidden;transition:transform .2s}
.playoff-card:hover{transform:translateY(-2px)}

.playoff-card.pf1{background:linear-gradient(135deg,#1a1400 0%,#2d2200 100%);border:2px solid #FFD700;box-shadow:0 0 40px rgba(255,215,0,.2),inset 0 1px 0 rgba(255,215,0,.3)}
.playoff-card.pf2{background:linear-gradient(135deg,#111316 0%,#1a1e22 100%);border:2px solid #C0C0C0;box-shadow:0 0 24px rgba(192,192,192,.15),inset 0 1px 0 rgba(192,192,192,.2)}
.playoff-card.pf3{background:linear-gradient(135deg,#130d08 0%,#1e1510 100%);border:2px solid #CD7F32;box-shadow:0 0 20px rgba(205,127,50,.15),inset 0 1px 0 rgba(205,127,50,.2)}

.pf-rank-wrap{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:64px}
.pf-medal{font-size:40px;line-height:1;filter:drop-shadow(0 0 8px currentColor)}
.pf1 .pf-medal{filter:drop-shadow(0 0 12px rgba(255,215,0,.6))}
.pf2 .pf-medal{filter:drop-shadow(0 0 8px rgba(192,192,192,.5))}
.pf3 .pf-medal{filter:drop-shadow(0 0 8px rgba(205,127,50,.5))}
.pf-pos{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase}
.pf1 .pf-pos{color:var(--gold)}
.pf2 .pf-pos{color:var(--silver)}
.pf3 .pf-pos{color:var(--bronze)}

.pf-info{flex:1;min-width:0}
.pf-name{font-size:20px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pf1 .pf-name{color:#FFD700}
.pf2 .pf-name{color:#E8E8E8}
.pf3 .pf-name{color:#CD7F32}
.pf-attempts{font-size:11px;color:var(--muted);margin-bottom:8px}
.pf-prize{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;font-size:13px;font-weight:700}
.pf1 .pf-prize{background:rgba(255,215,0,.15);color:#FFD700;border:1px solid rgba(255,215,0,.3)}
.pf2 .pf-prize{background:rgba(192,192,192,.12);color:#C0C0C0;border:1px solid rgba(192,192,192,.25)}
.pf3 .pf-prize{background:rgba(205,127,50,.12);color:#CD7F32;border:1px solid rgba(205,127,50,.25)}

.pf-score-wrap{text-align:right;flex-shrink:0}
.pf-score{font-size:36px;font-weight:900;letter-spacing:-1px;font-family:'JetBrains Mono',monospace;line-height:1}
.pf1 .pf-score{color:#FFD700;text-shadow:0 0 20px rgba(255,215,0,.4)}
.pf2 .pf-score{color:#C0C0C0;text-shadow:0 0 12px rgba(192,192,192,.3)}
.pf3 .pf-score{color:#CD7F32;text-shadow:0 0 12px rgba(205,127,50,.3)}
.pf-pts{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;text-align:right}

/* rest of list below top 3 in playoffs */
.playoffs-rest{margin-top:8px}
.playoffs-rest .lb-item{opacity:.7}
.playoffs-rest .lb-item:hover{opacity:1}

/* CORNER GLOW */
.playoff-card::before{content:'';position:absolute;top:-40px;right:-40px;
  width:120px;height:120px;border-radius:50%;opacity:.15;pointer-events:none}
.pf1::before{background:radial-gradient(circle,#FFD700,transparent)}
.pf2::before{background:radial-gradient(circle,#C0C0C0,transparent)}
.pf3::before{background:radial-gradient(circle,#CD7F32,transparent)}

/* VIEW TOGGLE */
/* VIEW TOGGLE */
.view-toggle{display:flex;gap:8px;align-items:center}
.view-btn{font-size:11px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer;
  border:1px solid var(--border);background:transparent;color:var(--muted);
  font-family:'Sora',sans-serif;transition:all .2s}
.view-btn.active{background:var(--green-glow);border-color:rgba(0,200,150,.35);color:var(--text)}
.view-btn:hover:not(.active){border-color:rgba(0,200,150,.2);color:var(--text)}

/* LIST VIEW — all 10 as rows */
.list-view .lb-item{background:var(--surface);border:1px solid var(--border);border-radius:14px;
  padding:14px 16px;margin-bottom:8px;display:flex;align-items:center;gap:14px;
  transition:border-color .2s, transform .5s cubic-bezier(.22,1,.36,1), opacity .5s ease;
  animation:fadeItem .45s cubic-bezier(.22,1,.36,1) both}
.list-view .lb-item:hover{border-color:rgba(0,200,150,.2)}
.list-item-rank{font-size:20px;font-weight:900;min-width:44px;text-align:center;
  font-family:'JetBrains Mono',monospace}
.list-item-rank.r1{color:var(--gold)}
.list-item-rank.r2{color:var(--silver)}
.list-item-rank.r3{color:var(--bronze)}
.list-item-rank.rn{color:var(--muted)}
.list-item-info{flex:1;min-width:0}
.list-item-name{font-size:15px;font-weight:700;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list-item-attempts{font-size:10px;color:var(--muted);margin-top:2px}
.list-item-score{font-size:24px;font-weight:900;color:var(--green);
  font-family:'JetBrains Mono',monospace;text-align:right}
.list-item-pts{font-size:9px;color:var(--muted);text-align:right;
  text-transform:uppercase;letter-spacing:.5px}

/* Countdown — hidden */
.countdown{display:none}

/* Loading skeleton */
.skeleton{background:linear-gradient(90deg,var(--surface) 25%,var(--surface2) 50%,var(--surface) 75%);
  background-size:200% 100%;animation:shimmer 1.5s infinite;border-radius:10px;height:60px;margin-bottom:8px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>

<script>
const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyPPMjS-wibkGqfJUBJUCkJKj93HWbN-y9QSjL5qHzYxoQB7O5p265tFAuy39G66fBA/exec';

const $ = id => document.getElementById(id);
let leaderboardData = [];
let countdownVal = 15;
let countdownTimer = null;
let searchTimer = null;

// ── FETCH LEADERBOARD ──
async function fetchLeaderboard() {
  try {
    $('lbMeta').innerHTML = '<span class="lb-refreshing"></span>Actualizando…';
    const res = await fetch(SCRIPT_URL + '?action=leaderboard', { redirect:'follow' });
    const data = await res.json();
    const prev = leaderboardData;
    leaderboardData = data.leaderboard || [];
    // Use smooth update if already had data
    if (currentView === 'list' && prev.length > 0) {
      const el = $('lbContent');
      renderListViewSmooth(leaderboardData, el);
    } else {
      renderLeaderboard(leaderboardData, data.total || 0);
    }
    const now = new Date().toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    $('lbMeta').textContent = `${data.total || 0} participantes · ${now}`;
  } catch(e) {
    $('lbMeta').textContent = 'Error al cargar';
  }
}

let currentView = 'list';

function setView(v) {
  currentView = v;
  $('btnList').classList.toggle('active', v === 'list');
  $('btnPodium').classList.toggle('active', v === 'podium');
  $('btnPlayoffs').classList.toggle('active', v === 'playoffs');
  renderLeaderboard(leaderboardData, leaderboardData.length);
}

function renderLeaderboard(lb, total) {
  const el = $('lbContent');
  if (!lb.length) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">⚽</div><div class="empty-txt">Aún no hay participantes.<br>¡Sé el primero en jugar!</div></div>`;
    return;
  }

  if (currentView === 'list') {
    renderListView(lb, el);
  } else if (currentView === 'playoffs') {
    renderPlayoffsView(lb, el);
  } else {
    renderPodiumView(lb, el);
  }
}

function renderListView(lb, el) {
  const medals = {1:'🥇', 2:'🥈', 3:'🥉'};
  const rankClass = r => r===1?'r1':r===2?'r2':r===3?'r3':'rn';
  let html = '<div class="list-view">';
  lb.forEach((p, i) => {
    const medal = medals[p.rank] || '';
    html += `<div class="lb-item" style="animation-delay:${i*0.04}s">
      <div class="list-item-rank ${rankClass(p.rank)}">${medal || ('#'+p.rank)}</div>
      <div class="list-item-info">
        <div class="list-item-name">${esc(p.name)}</div>
        <div class="list-item-attempts">${p.attempts} intento${p.attempts!==1?'s':''}</div>
      </div>
      <div>
        <div class="list-item-score">${p.score}</div>
        <div class="list-item-pts">pts</div>
      </div>
    </div>`;
  });
  html += '</div>';
  el.innerHTML = html;
}

function renderPodiumView(lb, el) {
  const medals = ['🥇','🥈','🥉'];
  const pClasses = ['p1','p2','p3'];
  let html = '';

  // Podium: 2nd left, 1st center, 3rd right
  const podiumOrder = [1,0,2];
  html += '<div class="podium">';
  podiumOrder.forEach(idx => {
    if (!lb[idx]) { html += '<div></div>'; return; }
    const p = lb[idx];
    html += `<div class="podium-item ${pClasses[idx]}">
      ${idx===0 ? '<div class="crown">👑</div>' : ''}
      <div class="podium-medal">${medals[idx]}</div>
      <div class="podium-name" title="${esc(p.name)}">${esc(p.name)}</div>
      <div class="podium-score">${p.score}</div>
      <div class="podium-pts">puntos</div>
      <div class="podium-attempts">${p.attempts} intento${p.attempts!==1?'s':''}</div>
    </div>`;
  });
  html += '</div>';

  // Positions 4-10
  if (lb.length > 3) {
    html += '<div class="lb-list">';
    lb.slice(3).forEach((p, i) => {
      html += `<div class="lb-item" style="animation-delay:${i*0.05}s">
        <div class="lb-rank">${p.rank}</div>
        <div class="lb-info">
          <div class="lb-name">${esc(p.name)}</div>
          <div class="lb-attempts">${p.attempts} intento${p.attempts!==1?'s':''}</div>
        </div>
        <div class="lb-score">${p.score}</div>
      </div>`;
    });
    html += '</div>';
  }
  el.innerHTML = html;
}

function renderPlayoffsView(lb, el) {
  const prizes = ['500 USDC', '300 USDC', '100 USDC'];
  const medals = ['🥇','🥈','🥉'];
  const pfClass = ['pf1','pf2','pf3'];
  const positions = ['1er Lugar','2do Lugar','3er Lugar'];

  let html = '<div class="playoffs-wrap">';

  // Top 3 — big playoff cards
  lb.slice(0, 3).forEach((p, i) => {
    if (!p) return;
    html += `<div class="playoff-card ${pfClass[i]}">
      <div class="pf-rank-wrap">
        <div class="pf-medal">${medals[i]}</div>
        <div class="pf-pos">${positions[i]}</div>
      </div>
      <div class="pf-info">
        <div class="pf-name">${esc(p.name)}</div>
        <div class="pf-attempts">${p.attempts} intento${p.attempts!==1?'s':''}</div>
        <div class="pf-prize">🏆 ${prizes[i]}</div>
      </div>
      <div class="pf-score-wrap">
        <div class="pf-score">${p.score}</div>
        <div class="pf-pts">puntos</div>
      </div>
    </div>`;
  });

  html += '</div>';

  // Positions 4-10 below
  if (lb.length > 3) {
    html += '<div class="playoffs-rest">';
    lb.slice(3).forEach((p, i) => {
      html += `<div class="lb-item" style="animation-delay:${i*0.05}s">
        <div class="list-item-rank rn">#${p.rank}</div>
        <div class="list-item-info">
          <div class="list-item-name">${esc(p.name)}</div>
          <div class="list-item-attempts">${p.attempts} intento${p.attempts!==1?'s':''}</div>
        </div>
        <div>
          <div class="list-item-score">${p.score}</div>
          <div class="list-item-pts">pts</div>
        </div>
      </div>`;
    });
    html += '</div>';
  }

  el.innerHTML = html;
}

// ── SEARCH ──
function onSearch(val) {
  clearTimeout(searchTimer);
  const q = val.trim();
  if (!q) { $('searchResults').innerHTML=''; return; }
  if (q.length < 2) return;
  searchTimer = setTimeout(() => doSearch(q), 350);
}

async function doSearch(q) {
  // First try local leaderboard data
  const local = leaderboardData.filter(p =>
    p.name.toLowerCase().includes(q.toLowerCase()) ||
    (p.email && p.email.toLowerCase().includes(q.toLowerCase()))
  );
  if (local.length) {
    renderSearchResults(local.map(p => ({...p, total: leaderboardData.length})));
    return;
  }

  // Fall back to API search (catches users outside top 10)
  try {
    const res = await fetch(SCRIPT_URL + '?action=search_player&query=' + encodeURIComponent(q), {redirect:'follow'});
    const data = await res.json();
    renderSearchResults(data.results || []);
  } catch(e) {}
}

function renderSearchResults(results) {
  const el = $('searchResults');
  if (!results.length) {
    el.innerHTML = '<div class="no-results">Sin resultados para esa búsqueda.</div>';
    return;
  }
  el.innerHTML = results.map(p => {
    const rankClass = p.rank===1?'top1':p.rank===2?'top2':p.rank===3?'top3':'';
    const medals = {1:'🥇',2:'🥈',3:'🥉'};
    const medal = medals[p.rank] || '';
    return `<div class="sr-item">
      <div class="sr-rank ${rankClass}">${medal||('#'+p.rank)}</div>
      <div class="sr-info">
        <div class="sr-name">${esc(p.name)}</div>
        ${p.email?`<div class="sr-email">${esc(p.email)}</div>`:''}
      </div>
      <div>
        <div class="sr-score">${p.score}</div>
        <div class="sr-total">de ${p.total||'?'} jugadores</div>
      </div>
    </div>`;
  }).join('');
}

// ── COUNTDOWN & AUTO REFRESH ──
function startCountdown() {
  countdownVal = 15;
  clearInterval(countdownTimer);
  countdownTimer = setInterval(() => {
    countdownVal--;
    $('countdown').textContent = countdownVal;
    if (countdownVal <= 0) {
      fetchLeaderboard();
      startCountdown();
    }
  }, 1000);
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── SEARCH TOGGLE ──
function toggleSearch() {
  const body = $('searchBody');
  const btn  = $('searchToggleBtn');
  const open = body.classList.toggle('open');
  btn.classList.toggle('open', open);
  btn.textContent = open ? '✕ Cerrar búsqueda' : '🔍 Buscar participante';
  if (open) setTimeout(() => $('searchInput').focus(), 200);
  else { $('searchInput').value = ''; $('searchResults').innerHTML = ''; }
}

// ── SMOOTH LIST UPDATE ──
// Instead of replacing innerHTML wholesale, animate position changes
let prevOrder = [];

function renderListViewSmooth(lb, el) {
  const medals = {1:'🥇', 2:'🥈', 3:'🥉'};
  const rankClass = r => r===1?'r1':r===2?'r2':r===3?'r3':'rn';

  // If first render or big change, just render normally
  const newOrder = lb.map(p => p.qr);
  const isFirstRender = prevOrder.length === 0;
  prevOrder = newOrder;

  if (isFirstRender) {
    renderListView(lb, el);
    return;
  }

  // Smooth: fade out old, fade in new with stagger
  el.style.opacity = '0';
  el.style.transform = 'translateY(4px)';
  el.style.transition = 'opacity .3s ease, transform .3s ease';
  setTimeout(() => {
    renderListView(lb, el);
    el.style.opacity = '1';
    el.style.transform = 'translateY(0)';
  }, 280);
}

// ── INIT ──
fetchLeaderboard();
startCountdown();
</script>
